name: DantaServer
version: '0.1.0-SNAPSHOT'
main: kr.danta.paper.DantaPlugin
api-version: '26.2'
author: Danta
load: POSTWORLD
description: 단타 비동기 국가 전략 서버 플러그인

commands:
  danta:
    description: 단타 서버 개발 정보를 표시합니다.
    usage: /danta
    permission: danta.command.danta

  nationgui:
    description: 단타 국가 정보 화면을 엽니다.
    aliases: [국가]
    usage: /국가 [국가-id]
    permission: danta.command.nation

  mapgui:
    description: 단타 전략 지도 화면을 엽니다.
    aliases: [지도]
    usage: /지도
    permission: danta.command.map

permissions:
  danta.command.danta:
    description: /danta 명령 사용을 허용합니다.
    default: true

  danta.admin.runtime:
    description: 개발용 서버 시간 관리를 허용합니다.
    default: op

  danta.admin.db:
    description: 개발용 PostgreSQL 관리와 저장소 테스트를 허용합니다.
    default: op


  danta.admin.nation:
    description: 개발용 국가 관리를 허용합니다.
    default: op

  danta.admin.point:
    description: 개발용 전략 거점 관리를 허용합니다.
    default: op

  danta.admin.edge:
    description: 개발용 전략 간선 관리를 허용합니다.
    default: op

  danta.admin.army:
    description: 개발용 군단 관리를 허용합니다.
    default: op

  danta.command.nation:
    description: 국가 정보 화면 사용을 허용합니다.
    default: true

  danta.command.map:
    description: 전략 지도 화면 사용을 허용합니다.
    default: true

  danta.admin.map:
    description: 개발용 시험 지도 불러오기와 구조물 배치를 허용합니다.
    default: op
